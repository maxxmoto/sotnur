<body>
    <!-- Шапка сайта -->
    <header class="header" id="header">
        <div class="container header-container">
            <a href="/" class="logo">
                <span class="logo-icon"></span>
                <span class="logo-text">Морской<br><strong>Глаз</strong></span>
            </a>
            
            <nav class="nav" id="nav">
                <a href="/" class="nav-link">Главная</a>
                <a href="#houses" class="nav-link">Дома</a>
                <a href="#contacts" class="nav-link">Контакты</a>
            </nav>
            
            <a href="#booking-widget" class="btn btn-primary">Забронировать</a>
            
            <button class="menu-toggle" id="menu-toggle" aria-label="Открыть меню">

        </div>
    </header>

    <!-- Основной контент -->

    <!-- Контакты и карта -->

                    <div class="contact-items">
                        <div class="contact-item">
                            <span class="contact-icon">📍</span>
                            <div>
                                <strong>Адрес</strong>
                                <span>с. Сотнур, Республика Марий Эл</span>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="contact-icon">📞</span>
                            <div>
                                <strong>Телефон</strong>
                                <a href="tel:+79370000000">+7 (937) 000-00-00</a>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="contact-icon">✉️</span>
                            <div>
                                <strong>Email</strong>
                                <a href="mailto:hello@sotnur.ru">hello@sotnur.ru</a>
                            </div>
                        </div>
                        <div class="contact-item">
                            <span class="contact-icon">📱</span>
                            <div>
                                <strong>Соцсети</strong>
                                <div class="social-links">

                        src="https://yandex.ru/map-widget/v1/?ll=48.7600%2C56.1628&z=15&l=map&pt=48.7600%2C56.1628%2Cpm2rdl"


    <!-- Футер -->

        <div class="container footer-container">
            <div class="footer-logo">
                <span class="logo-icon"></span>
                <span class="logo-text">Морской Глаз</span>
            </div>
            <p class="footer-text">© 2026 Дома в Сотнуре. Все права защищены.</p>
            <p class="footer-tagline">Отдых на природе в Марий Эл</p>
            <p class="footer-legal">
                <a href="#" onclick="showPrivacy(event)">Политика персональных данных</a>
                &nbsp;|&nbsp;
                <a href="#" onclick="showTerms(event)">Правила бронирования</a>
            </p>
            <p class="footer-legal">ИП «ФИО» · ИНН __________ · ОГРНИП __________</p>
        </div>
    </footer>

    <!-- Модальное окно быстрого бронирования -->
    <div class="modal" id="booking-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close" aria-label="Закрыть">&times;</button>
            <h3 class="modal-title">Быстрое бронирование</h3>
            <p class="modal-subtitle" id="modal-house-name"></p>
            <form method="POST" action="/book" class="booking-form" id="quick-book-form">
                <input type="hidden" name="house_id" id="modal-house-id">
                <div class="form-group">
                    <label for="modal-name">Ваше имя</label>
                    <input type="text" id="modal-name" name="name" required placeholder="Иван">
                </div>
                <div class="form-group">
                    <label for="modal-phone">Телефон</label>
                    <input type="tel" id="modal-phone" name="phone" required placeholder="+7 (999) 000-00-00">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Заезд</label>
                        <div class="airbnb-calendar-widget">
                            <input type="hidden" id="modal-checkin" name="checkin" required>
                            <div class="calendar-trigger-widget" id="modal-checkin-trigger" data-target="modal-checkin">Выберите дату</div>
                            <div class="calendar-dropdown-widget" id="modal-checkin-dropdown">
                                <div class="cal-header">
                                    <button type="button" class="cal-btn" onclick="modalCalPrev('modal-checkin')">←</button>
                                    <span class="cal-my" id="modal-checkin-my"></span>
                                    <button type="button" class="cal-btn" onclick="modalCalNext('modal-checkin')">→</button>
                                </div>
                                <div class="cal-week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
                                <div class="cal-days-widget" id="modal-checkin-days"></div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Выезд</label>
                        <div class="airbnb-calendar-widget">
                            <input type="hidden" id="modal-checkout" name="checkout" required>
                            <div class="calendar-trigger-widget" id="modal-checkout-trigger" data-target="modal-checkout">Выберите дату</div>
                            <div class="calendar-dropdown-widget" id="modal-checkout-dropdown">
                                <div class="cal-header">
                                    <button type="button" class="cal-btn" onclick="modalCalPrev('modal-checkout')">←</button>
                                    <span class="cal-my" id="modal-checkout-my"></span>
                                    <button type="button" class="cal-btn" onclick="modalCalNext('modal-checkout')">→</button>
                                </div>
                                <div class="cal-week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
                                <div class="cal-days-widget" id="modal-checkout-days"></div>
                            </div>
                        </div>
                    </div>
                </div>

                    <input type="checkbox" id="modal-consent" required>
                    <label for="modal-consent">Я согласен на <a href="#" onclick="showPrivacy(event)">обработку персональных данных</a> и принимаю <a href="#" onclick="showTerms(event)">правила бронирования</a></label>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="modal-submit-btn" disabled>Отправить заявку</button>

    <div id="notification-container"></div>

        <div class="cookie-icon">

                <circle cx="12" cy="12" r="10" fill="#d4c4a8"/>
                <circle cx="8" cy="9" r="1.5" fill="#b8a888"/>
                <circle cx="16" cy="8" r="1.5" fill="#b8a888"/>
                <circle cx="12" cy="14" r="2" fill="#b8a888"/>
                <circle cx="9" cy="16" r="1" fill="#b8a888"/>
                <circle cx="15" cy="15" r="1" fill="#b8a888"/>
            </svg>
        </div>
        <div class="cookie-text">
            <p>Мы используем cookies для улучшения работы сайта. Продолжая, вы соглашаетесь с <a href="#" onclick="showPrivacy(event)">политикой обработки персональных данных</a>.</p>
        </div>
        <button class="cookie-btn" onclick="acceptCookies()">Принять</button>

    <!-- Legal Modal -->

        <div class="legal-modal-content">

            <div id="legal-modal-content"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
    <script>
    function showNotification(message, type) {
        const container = document.getElementById('notification-container');
        const notification = document.createElement('div');
        notification.className = 'notification notification-' + type;
        notification.innerHTML = '<span class="notification-icon">' + (type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ') + '</span><span class="notification-text">' + message + '</span>';
        container.appendChild(notification);
        setTimeout(function() {
            notification.classList.add('show');
        }, 10);
        setTimeout(function() {
            notification.classList.remove('show');
            setTimeout(function() {
                notification.remove();
            }, 300);
        }, 4000);
    }

    {% if flash_message %}
    showNotification('{{ flash_message.text }}', '{{ flash_message.type }}');
    {% endif %}

    // Cookie Banner
    function acceptCookies() {
        document.cookie = 'cookies_accepted=1; path=/; max-age=' + (365 * 24 * 60 * 60);
        localStorage.setItem('cookies_accepted', '1');
        document.getElementById('cookie-banner').style.display = 'none';
    }
    
    // Показать баннер через 2 секунды если не принято (проверяем и cookie и localStorage)
    setTimeout(function() {
        var accepted = document.cookie.includes('cookies_accepted') || localStorage.getItem('cookies_accepted');
        if (!accepted) {
            var banner = document.getElementById('cookie-banner');
            if (banner) {
                banner.style.display = 'flex';
            }
        }
    }, 2000);
    
    // Чекбокс согласия - активация кнопки
    var consentCheckbox = document.getElementById('modal-consent');
    var submitBtn = document.getElementById('modal-submit-btn');
    if (consentCheckbox && submitBtn) {
        consentCheckbox.addEventListener('change', function() {
            submitBtn.disabled = !this.checked;
        });
    }
    
    // Функции для юридических ссылок - модальные окна
    function showPrivacy(e) {
        if (e) e.preventDefault();
        showLegalModal('privacy');
    }
    
    function showTerms(e) {
        if (e) e.preventDefault();
        showLegalModal('terms');
    }
    
    function showLegalModal(type) {
        var content = type === 'privacy' 
            ? '<h2>Политика обработки персональных данных</h2>' +
              '<p class="legal-subtitle">В соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных»</p>' +
              '<h3>1. Общие положения</h3>' +
              '<p>Настоящая политика определяет порядок обработки персональных данных и меры по обеспечению их безопасности у Оператора — ИП «ФИО» (далее — «Администрация»).</p>' +
              '<h3>2. Состав и категории обрабатываемых данных</h3>' +
              '<p>Администрация обрабатывает следующие категории персональных данных: фамилия, имя, отчество; номер телефона; адрес электронной почты; платёжные реквизиты (при возврате). Обработка осуществляется исключительно для бронирования и связи с гостем.</p>' +
              '<h3>3. Правовые основания обработки</h3>' +
              '<p>Основанием обработки персональных данных являются: ст. 6 152-ФЗ; договор бронирования (оферта); согласие субъекта; требования налогового законодательства.</p>' +
              '<h3>4. Цели обработки</h3>' +
              '<p>Персональные данные обрабатываются в целях: подтверждения и исполнения бронирования; связи с гостем; ведения бухгалтерского учёта; направления информационных сообщений (с отдельного согласия).</p>' +
              '<h3>5. Порядок и условия обработки</h3>' +
              '<p>Обработка производится как с использованием средств автоматизации, так и без них. Срок хранения — 3 года после последнего бронирования, после чего данные уничтожаются. Доступ к данным имеют только уполномоченные сотрудники Администрации.</p>' +
              '<h3>6. Трансграничная передача</h3>' +
              '<p>Трансграничная передача персональных данных не осуществляется.</p>' +
              '<h3>7. Права субъекта</h3>' +
              '<p>Вы вправе: получить информацию об обработке ваших данных; требовать их уточнения, блокирования или уничтожения; отозвать согласие; обжаловать действия в Роскомнадзоре. Запросы направляйте на hello@sotnur.ru с пометкой «ПД».</p>' +
              '<h3>8. Меры по защите данных</h3>' +
              '<p>Администрация принимает необходимые правовые, организационные и технические меры для защиты персональных данных от неправомерного доступа, уничтожения, изменения, блокирования, копирования, распространения.</p>' +
              '<h3>9. Уведомление об утечках</h3>' +
              '<p>В случае нарушения безопасности данных Администрация уведомляет Роскомнадзор и субъекта в порядке, установленном ст. 21 152-ФЗ.</p>' +
              '<h3>10. Реквизиты оператора</h3>' +
              '<p>ИП «ФИО»<br>ИНН: __________<br>ОГРНИП: __________<br>Юридический адрес: __________<br>Email: hello@sotnur.ru</p>'
            : '<h2>Правила бронирования и проживания</h2>' +
              '<p class="legal-subtitle">Настоящий документ является публичной офертой (ст. 437 ГК РФ). Осуществляя бронирование, вы подтверждаете ознакомление и согласие с данными правилами.</p>' +
              '<h3>1. Подтверждение брони</h3>' +
              '<p>Бронирование подтверждается после звонка менеджера в течение 30 минут. После подтверждения выставляется счёт на предоплату.</p>' +
              '<h3>2. Предоплата и оплата</h3>' +
              '<p>Требуется предоплата 30% от стоимости проживания в течение 24 часов после подтверждения. Полная оплата — в день заезда. Способ оплаты: наличные, банковский перевод, QR СБП.</p>' +
              '<h3>3. Отмена брони</h3>' +
              '<ul><li>За 7+ дней до заезда — возврат 100% предоплаты</li><li>За 3–7 дней до заезда — возврат 50% предоплаты</li><li>Менее чем за 3 дня — предоплата не возвращается</li><li>При отмене по инициативе Администрации (форс-мажор) — возврат 100%</li></ul>' +
              '<h3>4. Время заезда/выезда</h3>' +
              '<p>Заезд с 14:00, выезд до 12:00. При раннем заезде или позднем выезде (по согласованию) — доплата 500 ₽/час.</p>' +
              '<h3>5. Правила проживания</h3>' +
              '<ul><li>Запрещено курение в домах (штраф 5000 ₽)</li><li>Запрещены животные без предварительного согласования</li><li>Уважайте тишину после 22:00</li><li>Запрещено использование пиротехники</li><li>Не оставляйте электроприборы включёнными при выходе</li><li>Соблюдайте правила пожарной безопасности</li></ul>' +
              '<h3>6. Повреждения и уборка</h3>' +
              '<p>При повреждении имущества составляется акт, стоимость определяется по рыночным ценам. Залог возвращается в течение 3 дней после выезда при отсутствии повреждений. Запачканная мебель/постель сверх нормы — оплачивается химчистка.</p>' +
              '<h3>7. Залог</h3>' +
              '<p>Залог за сохранность имущества: 2000–5000 ₽ (в зависимости от дома). Возвращается в течение 3 рабочих дней после выезда и осмотра.</p>' +
              '<h3>8. Ответственность сторон</h3>' +
              '<p>Администрация не несёт ответственности за утерю личных вещей гостя. Гость несёт полную материальную ответственность за порчу имущества.</p>' +
              '<h3>9. Реквизиты</h3>' +
              '<p>ИП «ФИО»<br>ИНН: __________<br>ОГРНИП: __________<br>hello@sotnur.ru</p>';
        
        document.getElementById('legal-modal-content').innerHTML = content;
        document.getElementById('legal-modal').style.display = 'flex';
    }
    
    function closeLegalModal() {
        document.getElementById('legal-modal').style.display = 'none';

    </script>
    {% block scripts %}{% endblock %}
<!-- Кнопка вверх -->
    <button id="scroll-top" class="scroll-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="Наверх">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>
    
    <script>
        // Показ кнопки вверх при скролле
        window.addEventListener('scroll', function() {
            var btn = document.getElementById('scroll-top');
            if (btn) {
                if (window.scrollY > 300) {
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                } else {
                    btn.style.opacity = '0';
                    btn.style.pointerEvents = 'none';
                }
            }
        });
    </script>
    
    <!-- Custom Select JS -->
    <script>
    (function() {
        function initCustomSelects() {
            document.querySelectorAll('.select-trigger').forEach(function(trigger) {
                trigger.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var parent = this.parentElement;
                    var dropdown = parent.querySelector('.select-dropdown');
                    document.querySelectorAll('.select-dropdown').forEach(function(d) {
                        if (d !== dropdown) d.classList.remove('active');
                    });
                    dropdown.classList.toggle('active');
                });
            });
            
            document.querySelectorAll('.select-option').forEach(function(option) {
                option.addEventListener('click', function() {
                    var parent = this.closest('.custom-select');
                    var trigger = parent.querySelector('.select-trigger');
                    var input = parent.querySelector('input');
                    var value = this.dataset.value;
                    
                    input.value = value;
                    trigger.textContent = this.textContent;
                    parent.querySelector('.select-dropdown').classList.remove('active');
                });

        }
        
        if (document.readyState === 'loading') {

            initCustomSelects();

    <!-- Widget Calendar JS (рефакторинг: использует SotnurCalendarUtils) -->
    <script>
    var widgetMonths = { checkin: new Date(), checkout: new Date() };
    var widgetSelected = { checkin: null, checkout: null };
    var fullyBookedDates = {{ fully_booked_dates|default([])|tojson }};

    function initWidgetCalendar() {
        document.querySelectorAll('.calendar-trigger-widget').forEach(function(trigger) {
            trigger.addEventListener('click', function(e) {
                // Игнорируем клики внутри модального окна (обрабатываются modalCal)
                if (this.closest('#booking-modal')) return;
                e.stopPropagation();
                var target = this.dataset.target;
                var dropdown = document.getElementById(target + '-dropdown');
                document.querySelectorAll('.calendar-dropdown-widget').forEach(function(d) {
                    if (d !== dropdown) d.classList.remove('active');
                });
                if (dropdown) dropdown.classList.toggle('active');
                renderWidgetCalendar(target);
            });
        });

        document.addEventListener('click', function(e) {
            var widget = e.target.closest('.airbnb-calendar-widget');
            if (!widget || widget.closest('#booking-modal')) {
                document.querySelectorAll('.calendar-dropdown-widget').forEach(function(d) {
                    d.classList.remove('active');
                });
            }
        });

        renderWidgetCalendar('checkin');
        renderWidgetCalendar('checkout');
    }

    window.renderWidgetCalendar = function(target) {
        var myEl = document.getElementById(target + '-my');
        var daysEl = document.getElementById(target + '-days');
        if (!myEl || !daysEl) return;
        var date = widgetMonths[target];
        if (!date) return;

        myEl.textContent = SotnurCalendarUtils.monthNames[date.getMonth()] + ' ' + date.getFullYear();

        var grid = SotnurCalendarUtils.buildMonthGrid(date.getFullYear(), date.getMonth());

        var html = '';
        for (var i = 0; i < grid.length; i++) {
            var cell = grid[i];
            if (!cell) {
                html += '<div class="cal-day disabled"></div>';
            } else {
                var isSelected = widgetSelected[target] === cell.dateStr;
                var isBooked = !cell.isPast && fullyBookedDates.indexOf(cell.dateStr) !== -1;
                var classes = ['cal-day'];
                if (cell.isPast) classes.push('disabled');
                if (isBooked) classes.push('booked');
                if (isSelected) classes.push('selected');
                html += '<div class="' + classes.join(' ') + '" data-date="' + cell.dateStr + '" onclick="selectWidgetDate(\'' + target + '\', \'' + cell.dateStr + '\')">' + cell.day + '</div>';
            }
        }

        daysEl.innerHTML = html;
    };

    window.selectWidgetDate = function(target, dateStr) {
        var parts = dateStr.split('-');
        var year = parseInt(parts[0]);
        var month = parseInt(parts[1]) - 1;
        var day = parseInt(parts[2]);

        var currentDate = new Date(Date.UTC(year, month, day));
        var today = new Date(Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()));

        if (currentDate < today) return;
        if (fullyBookedDates.indexOf(dateStr) !== -1) return;

        widgetSelected[target] = dateStr;

        var trigger = document.getElementById(target + '-trigger');
        var input = document.getElementById(target);

        trigger.textContent = day + ' ' + SotnurCalendarUtils.monthNames[month];
        input.value = dateStr;

        var dropdown = document.getElementById(target + '-dropdown');
        if (dropdown) dropdown.classList.remove('active');
        renderWidgetCalendar('checkin');
        renderWidgetCalendar('checkout');
    };

    window.widgetCalPrev = function(target) {
        if (!widgetMonths[target]) return;
        widgetMonths[target].setMonth(widgetMonths[target].getMonth() - 1);
        renderWidgetCalendar(target);
    };

    window.widgetCalNext = function(target) {
        if (!widgetMonths[target]) return;
        widgetMonths[target].setMonth(widgetMonths[target].getMonth() + 1);
        renderWidgetCalendar(target);
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initWidgetCalendar);
    } else {
        initWidgetCalendar();
    }
    </script>

            var date = modalMonths[target];
            if (!date) return;

            myEl.textContent = SotnurCalendarUtils.monthNames[date.getMonth()] + ' ' + date.getFullYear();

            var grid = SotnurCalendarUtils.buildMonthGrid(date.getFullYear(), date.getMonth());

            var html = '';
            for (var i = 0; i < grid.length; i++) {

                if (!cell) {
                    html += '<div class="cal-day disabled"></div>';
                } else {
                    var isSelected = modalSelected[target] === cell.dateStr;
                    var isBooked = !cell.isPast && fullyBookedDates.indexOf(cell.dateStr) !== -1;

                    if (cell.isPast) classes.push('disabled');
                    if (isBooked) classes.push('booked');
                    if (isSelected) classes.push('selected');
                    html += '<div class="' + classes.join(' ') + '" data-date="' + cell.dateStr + '" onclick="selectModalDate(\'' + target + '\', \'' + cell.dateStr + '\')">' + cell.day + '</div>';
                }
            }

            daysEl.innerHTML = html;
        }

        window.selectModalDate = function(target, dateStr) {

            renderModalCalendar('modal-checkin');
            renderModalCalendar('modal-checkout');

        window.modalCalNext = function(target) {

            modalMonths[target].setMonth(modalMonths[target].getMonth() + 1);
            renderModalCalendar(target);
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initModalCalendar);

            initModalCalendar();
        }
    })();
